
name: Build REACH Agent Feed

# Run manually or when the source REACH CSV changes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Open Science Report (GitHub) - Open Science Report (1).csv'

# Required to publish generated files to the repository.
permissions:
  contents: write

# Prevent two feed-building runs from writing simultaneously.
concurrency:
  group: reach-agent-feed
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate REACH agent feed
        run: python scripts/build_reach_feed.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("agent-data/manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = manifest["source"]["rows"]

          for section in ("index", "details"):
              total = 0

              for entry in manifest[section]["files"]:
                  path = Path(entry["path"])
                  data = path.read_bytes()

                  assert len(data) == entry["bytes"]
                  assert len(data) <= 48 * 1024
                  assert hashlib.sha256(data).hexdigest() == entry["sha256"]

                  with path.open(
                      newline="", encoding="utf-8"
                  ) as file:
                      count = sum(1 for _ in csv.DictReader(file))

                  assert count == entry["rows"]
                  total += count

              assert total == expected
              print(f"{section}: {total} records verified")

          print("REACH agent feed validation passed!")
          PY

      # Publish generated files only after validation succeeds.
      - name: Publish agent feed to GitHub
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the generated agent-data directory.
          git add -A -- agent-data/

          if git diff --cached --quiet; then
            echo "No changes to the agent feed."
          else
            git commit -m "Update REACH Scout agent feed"
            git push
          fi

      # Retain a downloadable copy for troubleshooting.
      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: reach-agent-feed-preview
          path: agent-data/
          if-no-files-found: error
          retention-days: 7
