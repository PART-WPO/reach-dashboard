name: Build Scout Discovery Manifest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scout-discoveries/batches/*.csv'

permissions:
  contents: write

concurrency:
  group: scout-discovery-manifest
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate published Scout batches and build manifest
        run: python scout-discoveries/tools/build_manifest.py
      - name: Publish verified manifest only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scout-discoveries/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified Scout Discovery feed manifest'
            git push
          else
            echo 'Scout Discovery manifest is already current.'
          fi
